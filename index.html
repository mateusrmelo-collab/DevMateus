<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mateus Rodrigues - Portfólio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop" class="desktop" aria-label="Área de trabalho">
    <section class="desktop-icons" aria-label="Atalhos">

      <button class="icon-item" data-app="about" type="button">
        <img src="assets/vista_pc_1.ico" alt="Sobre Mim">
        <span class="desktop-fa about-icon" style="display:none"></span>
        <span>Sobre Mim</span>
      </button>

      <button class="icon-item" data-app="projects" type="button">
        <img src="assets/explorer.ico" alt="Projetos" >
        <span class="desktop-fa folder-icon" style="display:none"></span>
        <span>Projetos</span>
      </button>

      <button class="icon-item" data-app="social" type="button">
        <img src="assets/vista_messenger.ico" alt="Redes Sociais" >
        <span class="desktop-fa social-icon" style="display:none"></span>
        <span>Redes Sociais</span>
      </button>

      <button class="icon-item" data-app="vscode" type="button">
        <img src="assets/vs-removebg-preview.png" alt="Visual Studio Code" >
        <span class="desktop-fa vscode-icon" style="display:none"></span>
        <span>Visual Studio Code</span>
      </button>

      <button class="icon-item" data-app="cmd" type="button">
        <img src="assets/cmd-removebg-preview.png" alt="Prompt de Comando">
        <span class="desktop-fa cmd-icon" style="display:none"></span>
        <span>Prompt de Comando</span>
      </button>

      <button class="icon-item" data-app="trash" type="button">
        <img src="assets/trash-icon.png" alt="Lixeira" ></span>
        <span>Lixeira</span>
      </button>
    </section>

    <section class="main-container" aria-label="Apresentação">
      <div class="profile-card">
        <div class="profile-pic-container">
          <img src="assets/download20260500235506.png" alt="Mateus Rodrigues" class="profile-pic">
        </div>
        <h1>Mateus Rodrigues</h1>
        <p>Web Developer</p>

        <a href="https://github.com/mateusrmelo-collab" target="_blank" rel="noopener noreferrer" class="social-link">
          <i class="fa-brands fa-github github-color"></i>
          <span class="link-info"><strong>GitHub</strong><small>Meus projetos & repositórios</small></span>
        </a>
        <a href="https://www.instagram.com/im_still_alive63/" target="_blank" rel="noopener noreferrer" class="social-link">
          <i class="fa-brands fa-instagram instagram-color"></i>
          <span class="link-info"><strong>Instagram</strong><small>@im_still_alive63</small></span>
        </a>
        <a href="#" class="social-link">
          <i class="fa-brands fa-linkedin linkedin-color"></i>
          <span class="link-info"><strong>LinkedIn</strong><small>Conexões profissionais</small></span>
        </a>
      </div>
    </section>

    <section id="windowLayer" class="window-layer" aria-label="Janelas abertas"></section>

    <div id="contextMenu" class="context-menu" role="menu">
      <button class="context-item" data-context-action="refresh" type="button"><i class="fa-solid fa-arrows-rotate style-icon"></i> Atualizar Área de Trabalho</button>
      <button class="context-item" data-context-action="about" type="button"><i class="fa-solid fa-user style-icon"></i> Abrir Sobre Mim</button>
      <div class="separator"></div>
      <button class="context-item" data-context-action="cmd" type="button"><i class="fa-solid fa-terminal style-icon"></i> Abrir Prompt de Comando</button>
    </div>
  </main>

  <aside class="start-menu" id="startMenu" aria-label="Menu iniciar">
    <div class="start-left">
      <div class="start-user">
        <img src="assets/download20260500235506.png" alt="Mateus Rodrigues" >
        <span>Mateus Rodrigues</span>
      </div>
      <div class="start-section-title">Fixados & Favourites</div>

      <button class="start-item" data-app="about" type="button">
        <img src="assets/vista_pc_1.ico" alt=""></i><span>Sobre Mim</span>
      </button>
      <button class="start-item" data-app="projects" type="button">
        <img src="assets/explorer.ico" alt="" ></i><span>Projetos</span>
      </button>
      <button class="start-item" data-app="social" type="button">
        <img src="assets/vista_messenger.ico" alt="" ></i><span>Redes Sociais</span>
      </button>
      <button class="start-item" data-app="vscode" type="button">
        <img src="assets/vs-removebg-preview.png" alt="">
        <i class="fa-solid fa-code" style="display:none"></i><span>Visual Studio Code</span>
      </button>
      <button class="start-item" data-app="cmd" type="button">
        <img src="assets/cmd-removebg-preview.png" alt="">
        <i class="fa-solid fa-terminal" style="display:none"></i><span>Prompt de Comando</span>
      </button>
      <div class="start-section-title">Sistema</div>
      <button class="start-item" data-app="trash" type="button">
        <img src="assets/trash-icon.png" alt=""></i><span>Lixeira</span>
      </button>
    </div>
    <div class="start-right">
      <div class="start-profile-pic">
        <img src="assets/download20260500235506.png" alt="Mateus Rodrigues">
      </div>
      <a class="start-item right" href="https://github.com/mateusrmelo-collab" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i>GitHub</a>
      <a class="start-item right" href="https://www.instagram.com/im_still_alive63/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i>Instagram</a>
      <a class="start-item right" href="#"><i class="fa-brands fa-linkedin"></i>LinkedIn</a>
      <div class="start-divider"></div>
      <button class="start-item right power" id="powerButton" type="button"><i class="fa-solid fa-power-off"></i>Desligar</button>
    </div>
  </aside>

  <footer class="taskbar">
    <button class="start-button" id="startButton" type="button" aria-label="Abrir menu iniciar">
      <img src="assets/xp-removebg-preview.png" alt="Iniciar">
    </button>
    <div class="taskbar-icons" id="taskbarApps" aria-label="Aplicativos abertos"></div>
    <div class="system-tray">
      <span>PT <i class="fa-solid fa-chevron-up"></i></span>
      <i class="fa-solid fa-wifi" title="Conexão Online"></i>
      <i class="fa-solid fa-volume-high" title="Áudio 100%"></i>
      <div id="clock-container">
        <div id="clock">00:00</div>
        <div id="date">00/00/0000</div>
      </div>
    </div>
  </footer>

  <div class="shutdown-screen" id="shutdownScreen" aria-hidden="true">
    <i class="fa-brands fa-windows"></i>
    <p>Desligando o Sistema...</p>
    <button id="turnOnButton" type="button">Ligar novamente</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
